<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuScan AI - Advanced Document Intelligence Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body class="text-slate-200 antialiased flex flex-col justify-center items-center min-h-screen p-4">

    <!-- Primary Center Frame Container Wrapper -->
    <div class="w-full max-w-2xl dashboard-panel rounded-2xl p-8 shadow-2xl">
        
        <!-- Main Core Brand Title Layout Grid -->
        <header class="mb-8 border-b border-slate-800/80 pb-5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
            <div>
                <h1 class="text-3xl font-black tracking-tight bg-gradient-to-r from-sky-400 via-cyan-400 to-emerald-400 bg-clip-text text-transparent uppercase">
                    DocuScan AI
                </h1>
                <p class="text-slate-400 text-xs font-medium tracking-wide mt-1">Llama 3 Ecosystem Document Analysis Workspace</p>
            </div>
            <div class="flex items-center">
                <span class="bg-sky-500/10 text-sky-400 text-3xs font-bold font-mono tracking-widest px-2.5 py-1 rounded-full border border-sky-500/20 uppercase">
                    Groq Engine Active
                </span>
            </div>
        </header>

        <form class="space-y-5" onsubmit="event.preventDefault();">
            <!-- Drag & Drop Interface Interaction Zone Container -->
            <div>
                <label class="block text-3xs font-extrabold uppercase tracking-widest text-slate-400 mb-2">Target Document File</label>
                <div id="dropZone" class="file-drop-area rounded-xl p-8 text-center cursor-pointer">
                    <input type="file" id="docFile" accept=".txt,.md,.log" class="hidden">
                    <div class="h-10 w-10 mx-auto mb-2 text-sky-400/80 bg-sky-500/5 flex items-center justify-center rounded-lg border border-sky-500/10">
                        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                    </div>
                    <p class="text-sm text-slate-300 font-medium">Drag and drop file here, or <span class="text-sky-400 hover:underline">browse files</span></p>
                    <p class="text-3xs font-mono text-slate-500 mt-1.5 uppercase tracking-wide">Plain Text (.txt), Markdown (.md), or Server Logs (.log)</p>
                </div>

                <!-- Live Upload Identification Metric Widget Box -->
                <div id="fileInfo" class="hidden mt-3 flex items-center justify-between bg-slate-950/60 border border-slate-800 rounded-xl p-3.5 text-xs">
                    <div class="flex items-center gap-2.5 overflow-hidden">
                        <span class="text-emerald-400 text-sm font-semibold flex-shrink-0">✔</span>
                        <span id="fileNameDisplay" class="font-mono text-slate-300 truncate"></span>
                    </div>
                    <span id="fileSizeDisplay" class="bg-slate-900 border border-slate-800 text-slate-400 font-mono font-bold px-2 py-0.5 rounded text-2xs flex-shrink-0"></span>
                </div>
            </div>

            <!-- Analysis Option Mode Select Matrix Wrapper -->
            <div>
                <label for="analysisType" class="block text-3xs font-extrabold uppercase tracking-widest text-slate-400 mb-2">Analysis Processing Strategy</label>
                <select id="analysisType" class="input-field-focus w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm transition-all text-slate-200 focus:outline-none">
                    <option value="Executive Summary Layout">Executive Summary Report</option>
                    <option value="Compliance & Security Audit Check">Compliance & Security Audit Check</option>
                    <option value="Key Entity & Variable Extraction">Key Entity & Variable Extraction</option>
                </select>
            </div>

            <!-- Pipeline Execution Trigger Button -->
            <button type="button" id="submitBtn" onclick="uploadAndAnalyze()" class="btn-cyber-glow w-full bg-gradient-to-r from-sky-500 via-cyan-500 to-blue-600 font-bold py-3.5 rounded-xl text-white shadow-lg text-sm tracking-wide">
                Run Context Analysis Pipeline
            </button>
        </form>

        <!-- Dynamic JSON/Text AI Results Console Screen Frame Terminal -->
        <div id="outputContainer" class="hidden mt-6 border-t border-slate-800/80 pt-5">
            <div class="flex items-center justify-between mb-2.5">
                <div class="flex items-center gap-2">
                    <span class="h-1.5 w-1.5 rounded-full bg-cyan-400 animate-pulse"></span>
                    <span id="statusText" class="text-3xs uppercase tracking-widest font-black text-cyan-400/90 font-mono">STANDBY...</span>
                </div>
                <button onclick="copyToClipboard()" class="text-3xs font-extrabold text-slate-400 hover:text-sky-400 bg-slate-950 hover:bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-lg transition-colors uppercase tracking-wider">
                    Copy Response
                </button>
            </div>
            <div class="terminal-view rounded-xl p-5 shadow-inner max-h-72 overflow-y-auto">
                <pre id="resultText" class="text-slate-300 text-xs font-mono whitespace-pre-wrap leading-relaxed select-text"></pre>
            </div>
        </div>
    </div>

    <script src="../static/app.js"></script>
</body>
</html>
